name: Production site audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Audit production crawl paths
        run: python3 audit_site.py
