# Google Cloud Build — yishun-agents backend
#
# Builds the FastAPI container from packages/agents/, pushes to GCR,
# and deploys to Cloud Run in asia-southeast1.
#
# Run manually:
#   gcloud builds submit --config infra/cloudbuild.yaml .
#
# Or wire up a Cloud Build trigger in the GCP console pointing at this file.
#
# Secrets (SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, etc.) must
# be set on the Cloud Run service separately — never commit them here.
#
# Stage 1 moved from Groq to Gemini in 2026-07: GROQ_API_KEY is retired and
# GEMINI_API_KEY replaces it. STAGE1_MODEL/STAGE1_RPM/STAGE1_RPD are plain env
# vars (not secrets) so the model/limits can change without a redeploy of code.
#
# ⚠️ --set-env-vars REPLACES the service's entire env-var set; any key not listed
# is deleted. The command below is therefore only safe as genuine FIRST-TIME
# setup. To change one value later use --update-env-vars, which merges.
# CLUSTER_BEFORE_WRITE is included below because omitting it from a --set-env-vars
# run silently reverts clustering to the code default 'off' (a valid mode that
# fails quietly — see docs/PIPELINE_CHANGES_2026-07-30.md). The deploy step also
# re-pins it on every build, so a mistake here self-heals on the next deploy.
#
# One-time setup:
#   gcloud run services update yishun-agents \
#     --region asia-southeast1 \
#     --set-env-vars "SUPABASE_URL=...,CF_R2_BUCKET_NAME=yishun-assets,STAGE1_MODEL=gemini-3.1-flash-lite,STAGE1_RPM=30,STAGE1_RPD=1500,CLUSTER_BEFORE_WRITE=on,..." \
#     --set-secrets "SUPABASE_SECRET_KEY=supabase-secret-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CF_R2_ACCOUNT_ID=cf-r2-account-id:latest,CF_R2_ACCESS_KEY_ID=cf-r2-access-key-id:latest,CF_R2_SECRET_ACCESS_KEY=cf-r2-secret-access-key:latest,MODAL_TOKEN_ID=modal-token-id:latest,MODAL_TOKEN_SECRET=modal-token-secret:latest"
#
# Retire the old secret once the migration is verified:
#   gcloud run services update yishun-agents --region asia-southeast1 --remove-secrets GROQ_API_KEY

substitutions:
  _REGION:  asia-southeast1
  _SERVICE: yishun-agents
  _IMAGE:   gcr.io/$PROJECT_ID/yishun-agents

steps:
  # ── 1. Build ────────────────────────────────────────────────────────────
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - $_IMAGE:$COMMIT_SHA
      - --tag
      - $_IMAGE:latest
      - --cache-from
      - $_IMAGE:latest
      # Build context is packages/agents/ — that's where the Dockerfile lives.
      - packages/agents

  # ── 2. Push ─────────────────────────────────────────────────────────────
  - id: push-sha
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, $_IMAGE:$COMMIT_SHA]

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, $_IMAGE:latest]

  # ── 3. Deploy ────────────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-sha]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image
      - $_IMAGE:$COMMIT_SHA
      - --region
      - $_REGION
      - --platform
      - managed
      # Auth is OPS_TOKEN, not Cloud Run IAM. Every route except /health is
      # behind main.py::_require_ops_token (hmac.compare_digest; 503 if the
      # server has no token), so the shared secret is the gate.
      #
      # This said --no-allow-unauthenticated until 2026-08-04 and it is the
      # single reason the art pipeline never produced an image. IAM wants a
      # Google-signed OIDC token in `Authorization`; the War Room runs on
      # Vercel, not GCP, and lib/artGenerate.ts sends only `X-Ops-Token`. Every
      # /art/generate call died at the edge with "403 ... Empty Authorization
      # header value" and never reached FastAPI. Cloud Scheduler was unaffected
      # (it runs as yishun-scheduler@, still bound as an invoker), so the daily
      # chain kept working and hid it.
      #
      # Note --no-allow-unauthenticated does not merely *omit* a binding, it
      # REWRITES the service IAM policy and drops allUsers. So fixing this by
      # hand does not stick: a deploy through this file silently reverts it, and
      # the only symptom is /rectify cards going transient with empty prompt
      # boxes. Changing it here is what makes the fix survive the next build.
      - --allow-unauthenticated
      # These MUST match the canonical deploy in CLAUDE.md: a daily pass runs
      # 5–20 min, so --timeout=3600 is required (the 300 s default kills it on
      # a first-time deploy through this file), 1Gi matches the documented
      # service config (this file previously downgraded it to 512Mi on every
      # build), and max-instances=2 is the cost control.
      - --timeout
      - "3600"
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "2"
      - --port
      - "8080"
      # ── Pinned behaviour flags ────────────────────────────────────────────
      # --update-env-vars MERGES: it sets these keys and leaves every other env
      # var on the service untouched. Do NOT change this to --set-env-vars,
      # which REPLACES the whole set and would wipe the secrets and the Stage 1
      # config that are managed separately.
      #
      # Only vars whose CODE DEFAULT DIFFERS FROM PRODUCTION INTENT belong here.
      # Everything else (STAGE2_WRITE_MODEL, STAGE2_SUMMARY_RATIO, the max_tokens
      # caps, OVERSIZED_MERGE_*) already defaults correctly in code, so pinning
      # them would just create a second source of truth to drift.
      #
      # CLUSTER_BEFORE_WRITE qualifies: the code default is 'off'
      # (ingestion/orchestrator.py), production runs 'on', and 'off' is a VALID
      # mode — it raises nothing and logs nothing, it just silently goes back to
      # one queue row per URL. The only symptom is the single-source rate
      # drifting back toward its 75.6% baseline over weeks. See
      # docs/PIPELINE_CHANGES_2026-07-30.md.
      - --update-env-vars
      - CLUSTER_BEFORE_WRITE=on

images:
  - $_IMAGE:$COMMIT_SHA
  - $_IMAGE:latest

options:
  logging: CLOUD_LOGGING_ONLY
